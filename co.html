<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | AnimeStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background:#0a0a0a;
            color:white;
        }

        .contact-card {
            background:#111;
            border-radius:15px;
            padding:30px;
            box-shadow:0 0 25px rgba(255,0,85,.25);
        }

        .contact-title {
            color:#ff0055;
            font-weight:800;
        }

        .form-control {
            background:#1a1a1a;
            border:1px solid #333;
            color:white;
        }

        .form-control:focus {
            background:#1a1a1a;
            color:white;
            border-color:#ff0055;
            box-shadow:none;
        }

        /* ===== PLACEHOLDER COLOR FIX ===== */
        ::placeholder {
            color: #ffffff !important;
            opacity: 0.6;
        }

        ::-webkit-input-placeholder { color: #ffffff; opacity: 0.6; }
        :-ms-input-placeholder { color: #ffffff; opacity: 0.6; }
        ::-ms-input-placeholder { color: #ffffff; opacity: 0.6; }

        .btn-anime {
            background:linear-gradient(45deg,#ff0099,#493240);
            border:none;
            color:white;
            font-weight:600;
        }

        .btn-anime:hover {
            box-shadow:0 0 15px #ff0055;
            transform:scale(1.03);
        }

        .contact-option {
            background:#151515;
            border-radius:12px;
            padding:15px;
            transition:.3s;
        }

        .contact-option:hover {
            background:#ff0055;
            transform:translateY(-4px);
        }

        .contact-option i {
            font-size:24px;
        }

        footer {
            color:#777;
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-dark navbar-expand-lg bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="index.html">AnimeStream</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
            </li>
        </ul>
    </div>
</nav>

<!-- ===== CONTACT SECTION ===== -->
<div class="container my-5">
    <div class="row g-4">

        <!-- CONTACT FORM -->
        <div class="col-lg-7">
            <div class="contact-card">
                <h2 class="contact-title mb-3">Contact Us</h2>
                <p class="text-secondary mb-4">
                    Anime requests, bugs, or support — message us 🎌
                </p>

                <form id="contactForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <input type="text" id="name" class="form-control" placeholder="Your Name">
                        </div>
                        <div class="col-md-6">
                            <input type="email" id="email" class="form-control" placeholder="Your Email">
                        </div>
                    </div>

                    <div class="mb-3">
                        <textarea id="message" class="form-control" rows="5" placeholder="Your Message"></textarea>
                    </div>

                    <button class="btn btn-anime w-100">Send Message</button>
                </form>

                <div id="successMsg" class="alert alert-success mt-3 d-none">
                    ✅ Message sent successfully!
                </div>
            </div>
        </div>

        <!-- OTHER CONTACT OPTIONS -->
        <div class="col-lg-5">
            <div class="contact-card">
                <h4 class="contact-title mb-3">Other Ways</h4>

                <div class="d-grid gap-3">
                    <div class="contact-option d-flex align-items-center gap-3">
                        <i class="bi bi-envelope-fill"></i>
                        <span>support@animestream.com</span>
                    </div>

                    <div class="contact-option d-flex align-items-center gap-3">
                        <i class="bi bi-telegram"></i>
                        <span>t.me/AnimeStream</span>
                    </div>

                    <div class="contact-option d-flex align-items-center gap-3">
                        <i class="bi bi-discord"></i>
                        <span>discord.gg/AnimeStream</span>
                    </div>

                    <div class="contact-option d-flex align-items-center gap-3">
                        <i class="bi bi-twitter-x"></i>
                        <span>@AnimeStream</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<footer class="bg-dark text-center py-3">
    © 2025 AnimeStream
</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->
<script>
    const form = document.getElementById("contactForm");
    const success = document.getElementById("successMsg");

    form.addEventListener("submit", e => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("message").value.trim();

        if (!name || !email || !message) {
            alert("⚠️ Please fill all fields");
            return;
        }

        success.classList.remove("d-none");
        form.reset();

        setTimeout(() => success.classList.add("d-none"), 4000);
    });
</script>

</body>
</html>
