<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AnimeStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background:#0a0a0a;
            color:white;
        }

        /* ===== WELCOME SCREEN ===== */
        #welcome-screen,
        #loading-screen {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #loading-screen {
            display: none;
            z-index: 9998;
        }

        #welcome-animation { width: 450px; }
        #loading-animation { width: 100%; }

        /* ===== CARDS ===== */
        .anime-card {
            border-radius: 15px;
            overflow: hidden;
            transition: transform .3s;
        }

        .anime-card:hover {
            transform: scale(1.05);
        }

        .anime-card img {
            height: 350px;
            object-fit: cover;
        }

        .overlay {
            position:absolute;
            bottom:0;
            width:100%;
            background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
            padding:15px;
        }

        .btn-anime {
            background:linear-gradient(45deg,#ff0099,#493240);
            border:none;
            color:white;
        }

        .genre-btn {
            padding:8px 15px;
            border-radius:20px;
            background:#1a1a1a;
            border:1px solid #333;
            cursor:pointer;
        }

        .genre-btn:hover {
            background:#ff0055;
            border-color:#ff0055;
        }
    </style>
</head>

<body>

<!-- ===== WELCOME SCREEN ===== -->
<div id="welcome-screen">
    <div id="welcome-animation"></div>
</div>

<!-- ===== LOADING SCREEN ===== -->
<div id="loading-screen">
    <div id="loading-animation"></div>
</div>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-dark navbar-expand-lg bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="#">AnimeStream</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="genreToggle">Genres</a>
                </li>
                <li class="nav-item">
                   <a class="nav-link" href="javascript:void(0)" onclick="goToTopAnime()">Top Anime</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="co.html">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== GENRE SECTION ===== -->
<div class="container my-4 d-none" id="genre-section">
    <h4 class="text-danger mb-3">Genres</h4>
    <div id="genre-list" class="d-flex flex-wrap gap-2"></div>
</div>

<!-- ===== ANIME LIST ===== -->
<div class="container my-5">
    <div class="row g-4" id="anime-list"></div>
</div>

<footer class="bg-dark text-center text-secondary py-3">
    © 2025 AnimeStream
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="script.js"></script>

</body>
</html>
