<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top Anime | AnimeStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#0a0a0a; color:white; }

        .anime-card {
            border-radius: 15px;
            overflow: hidden;
            transition: transform .3s;
        }
        .anime-card:hover { transform: scale(1.05); }

        .anime-card img {
            height: 350px;
            object-fit: cover;
        }

        .overlay {
            position:absolute;
            bottom:0;
            width:100%;
            background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
            padding:15px;
        }

        .btn-anime {
            background:linear-gradient(45deg,#ff0099,#493240);
            border:none;
            color:white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="index.html">AnimeStream</a>
        <span class="text-white">Top Anime</span>
    </div>
</nav>

<div class="container my-5">
    <h3 class="text-danger mb-4">Top Rated Anime</h3>
    <div class="row g-4" id="top-anime-list"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="script.js"></script>
</body>
</html>
